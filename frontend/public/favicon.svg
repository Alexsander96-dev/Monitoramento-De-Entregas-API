<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Rounded background -->
  <rect width="48" height="48" rx="12" fill="#12121a" stroke="rgba(99, 102, 241, 0.2)" stroke-width="2"/>
  
  <!-- Motorcycle paths -->
  <g transform="translate(4, 6)">
    <!-- Back wheel -->
    <circle cx="10" cy="26" r="6" stroke="#f1f5f9" stroke-width="3" fill="#06060b"/>
    <circle cx="10" cy="26" r="2" fill="#6366f1"/>
    
    <!-- Front wheel -->
    <circle cx="30" cy="26" r="6" stroke="#f1f5f9" stroke-width="3" fill="#06060b"/>
    <circle cx="30" cy="26" r="2" fill="#6366f1"/>
    
    <!-- Body / Frame -->
    <path d="M10 26h10l4-9h8l-2 9" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Handlebar & Fork -->
    <path d="M30 26l-3-15h-4" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Seat -->
    <path d="M12 17h8" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Delivery Box (Baú de entrega no bagageiro) -->
    <rect x="6" y="8" width="10" height="9" rx="2" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  </g>
</svg>